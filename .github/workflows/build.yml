name: Build ClamAV for Ubuntu 18.04

# Builds ClamAV inside an ubuntu:18.04 container, so the result links against
# the same system libraries as an 18.04 server, and packages it as a .deb that
# installs into /opt/clamav without touching Ubuntu's own clamav packages.
#
# Every push builds and tests the package and keeps it as a workflow artifact.
# Pushing a tag such as v1.4.6-1 also publishes it as a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CLAMAV_VERSION: "1.4.6"
  PKG_REVISION: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Use the version from the tag, if this is a tag build
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"            # 1.4.6-1
          echo "CLAMAV_VERSION=${tag%-*}" >> "$GITHUB_ENV"
          echo "PKG_REVISION=${tag##*-}"  >> "$GITHUB_ENV"

      - name: Build in an Ubuntu 18.04 container
        run: |
          mkdir -p dist
          set -o pipefail
          docker run --rm \
            -e CLAMAV_VERSION -e PKG_REVISION \
            -v "$PWD:/src" -w /src \
            ubuntu:18.04 bash -x scripts/build.sh 2>&1 | tee build.log

      - name: Report the end of the build log as an annotation
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          # Annotations are short, so report the error lines rather than the raw tail.
          errs=$(grep -n -E '(error|Error|ERROR)( |:|\[)' build.log | grep -v -i -E 'warning|-Werror|error_|_error|errors\.h|strerror' | tail -n 25)
          [ -n "$errs" ] || errs=$(tail -n 25 build.log)
          msg=$(printf '%s\n' "$errs" | cut -c1-220 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Build errors::${msg}"

      - name: Install and run the package in a clean Ubuntu 18.04 container
        run: |
          docker run --rm -v "$PWD/dist:/dist" ubuntu:18.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq /dist/*.deb
            /opt/clamav/bin/clamscan --version
            /opt/clamav/sbin/clamd --version
            /opt/clamav/bin/freshclam --version
            if find /opt/clamav -type f \( -perm -u+x -o -name "*.so*" \) -exec ldd {} + 2>/dev/null | grep "not found"; then exit 1; fi
            echo "package installs and runs"
          '

      - name: Checksums
        run: cd dist && sha256sum *.deb | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: clamav-opt-${{ env.CLAMAV_VERSION }}-${{ env.PKG_REVISION }}
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --title "ClamAV ${CLAMAV_VERSION} for Ubuntu 18.04 (package revision ${PKG_REVISION})" \
            --notes "Built from the official ClamAV ${CLAMAV_VERSION} source in an ubuntu:18.04 container. Installs to /opt/clamav. See README for install, switch-over and rollback."
