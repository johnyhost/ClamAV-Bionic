# clamd configuration for the clamav-opt package (/opt/clamav).
# systemd starts clamd as user "clamav" (see clamav14-daemon.service), so no
# "User" line is needed here. The socket lives in a directory of its own, so
# it never collides with Ubuntu's clamav-daemon (/var/run/clamav/clamd.ctl).

LocalSocket /run/clamav14/clamd.ctl
LocalSocketMode 666
FixStaleSocket yes
Foreground yes

DatabaseDirectory /var/lib/clamav14
TemporaryDirectory /tmp

LogSyslog yes
LogFacility LOG_MAIL
LogTime yes

# Load new definitions without keeping two copies in memory at once.
# Costs a short pause in scanning during a reload, saves about 1 GB of RAM.
ConcurrentDatabaseReload no
SelfCheck 3600

MaxThreads 8
ReadTimeout 180
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
