# freshclam configuration for the clamav-opt package (/opt/clamav).
DatabaseDirectory /var/lib/clamav14
DatabaseOwner clamav
DatabaseMirror database.clamav.net

LogSyslog yes
LogFacility LOG_MAIL
LogTime yes
Foreground yes

# Check twice a day and tell clamd to reload when something changed.
Checks 2
NotifyClamd /opt/clamav/etc/clamd.conf
